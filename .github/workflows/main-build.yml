name: Main Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

# Never cancel an in-flight merge run: two quick merges must publish and
# promote one after the other, not race each other.
concurrency:
  group: main-build
  cancel-in-progress: false

jobs:
  npm-merge:
    permissions:
      contents: read
      id-token: write
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-npm-merge.yml@main
    with:
      npm_package_name: "@devopsplaybook.io/common-utils"
      node_version: "22"
      publish_provenance: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
